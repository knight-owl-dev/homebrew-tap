# Allowed `vars.*` references in workflows. See:
# https://github.com/rhysd/actionlint/blob/main/docs/config.md
config-variables:
  - APP_CLIENT_ID

# GitHub-hosted labels actionlint's built-in list lacks; drop each once
# upstream knows it (https://github.com/rhysd/actionlint/issues/742).
self-hosted-runner:
  labels:
    - ubuntu-26.04
    - ubuntu-26.04-arm
