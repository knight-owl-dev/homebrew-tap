name: CI

on:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-26.04-arm
    container: ghcr.io/knight-owl-dev/ci-tools:v1.6.1@sha256:822d75b014b3de9859297439df2d31b3a761a293db5d0b1874cd18c77f03068f
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: make lint SKIP=lint-brew

  test-bot:
    # Named by platform, not runner label: the main ruleset requires these
    # checks, and a runner bump would otherwise rename one out from under it.
    name: test-bot (${{ matrix.platform }})
    strategy:
      matrix:
        include:
          - platform: linux-x64
            runner: ubuntu-26.04
          - platform: linux-arm64
            runner: ubuntu-26.04-arm
          - platform: macos-arm64
            runner: macos-26
    runs-on: ${{ matrix.runner }}
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
    steps:
      - name: Configure git defaults
        run: git config --global init.defaultBranch main

      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@e99025eb970cfa124b8284a35463d87426917478 # 2026.09.28.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Homebrew Bundler RubyGems
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.set-up-homebrew.outputs.gems-path }}
          key: ${{ matrix.runner }}-rubygems-${{ steps.set-up-homebrew.outputs.gems-hash }}
          restore-keys: ${{ matrix.runner }}-rubygems-

      - run: brew developer on

      - run: brew test-bot --only-cleanup-before

      - run: brew test-bot --only-setup

      - run: brew test-bot --only-tap-syntax
      - run: brew test-bot --only-formulae

      - name: Upload bottles as artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bottles_${{ matrix.platform }}
          path: '*.bottle.*'
